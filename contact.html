		<helmet>

			<link rel="stylesheet" href="css/main.css?v=136">

		<div class="site">
			
<sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
				<div class="toast">{{ toast }}</div>
			</sc-if>

			<main class="site-main">
				<section data-screen-label="Contact hero" data-vt-hero="1" style="background:linear-gradient(160deg,#0548E0 0%,#0556CC 45%,#2F86E8 100%);position:relative;overflow:hidden">
					<div data-hero-art="1" style="position:absolute;right:-4%;top:50%;transform:translateY(-50%);height:calc(118% - 60px);width:auto;aspect-ratio:1;background:{{ artColor }};opacity:.85;-webkit-mask-image:{{ artMask }};mask-image:{{ artMask }};-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;pointer-events:none"></div>
					<div data-rsp-pad="1" style="max-width:1280px;margin:0 auto;padding:140px 40px 180px;box-sizing:border-box;position:relative">
						<h1 style="margin:0 0 28px;color:#fff;font-weight:300;font-size:clamp(34px,4vw,52px);line-height:1.12">Contact us.</h1>
						<p style="margin:0;color:#fff;font-weight:300;font-size:clamp(20px,2vw,26px);line-height:1.3;max-width:640px">How can we help?</p>
					</div>
				</section>

				<section data-screen-label="Contact panel" class="contact-panel">
					<div class="contact-panel__inner">
						<div>
							<h2 class="contact-panel__title">Get in <span>touch.</span></h2>

							<div class="contact-detail">
								<span class="contact-detail__label">Phone</span>
								<a href="tel:+15613721027" class="contact-detail__value">(561) 372-1027</a>
							</div>
							<div class="contact-detail">
								<span class="contact-detail__label">Email</span>
								<a href="mailto:info@veritant.com" class="contact-detail__value">info@veritant.com</a>
							</div>
							<div class="contact-detail">
								<span class="contact-detail__label">Address</span>
								<p class="contact-detail__value">6800 Broken Sound Parkway NW<br>Suite 125<br>Boca Raton, FL 33487</p>
							</div>
						</div>

						<div class="contact-form">
							<h2 class="contact-form__title">Send a message.</h2>
							<p class="contact-form__text">Share a few details and we’ll get back to you.</p>
							<div class="contact-form__frame">
								<iframe
									data-w-type="embedded"
									title="Contact Veritant Research"
									frameborder="0"
									scrolling="no"
									marginheight="0"
									marginwidth="0"
									src="https://go.mail.shookresearch.com/wgt/sy0h8/sw4r/form?c=1859558a"
									width="100%"
									style="height: 0;"
								></iframe>
							</div>
						</div>
					</div>
				</section>

				</main>
			<div data-vt-site-end></div>
		</div>
