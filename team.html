<!doctype html>
<html lang="en" data-page="team">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- SEO -->
    <title>Team | Veritant Research</title>
    <meta
      name="description"
      content="Meet the Veritant team: researchers, analysts and event builders who spend the year talking to advisors, their firms, their peers and their competitors." />
    <link rel="canonical" href="https://www.veritantresearch.com/team.html" />
    <meta name="robots" content="index, follow" />

    <!-- Favicons -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#022E59" />

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Veritant Research" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Team | Veritant Research" />
    <meta
      property="og:description"
      content="Meet the Veritant team: researchers, analysts and event builders who spend the year talking to advisors, their firms, their peers and their competitors." />
    <meta
      property="og:url"
      content="https://www.veritantresearch.com/team.html" />
    <meta
      property="og:image"
      content="https://www.veritantresearch.com/assets/social/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Veritant: independent research, trusted advisor rankings" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Team | Veritant Research" />
    <meta
      name="twitter:description"
      content="Meet the Veritant team: researchers, analysts and event builders who spend the year talking to advisors, their firms, their peers and their competitors." />
    <meta
      name="twitter:image"
      content="https://www.veritantresearch.com/assets/social/og-default.jpg" />
    <meta
      name="twitter:image:alt"
      content="Veritant: independent research, trusted advisor rankings" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.veritantresearch.com/#organization",
            "name": "Veritant Research",
            "alternateName": "SHOOK Research",
            "url": "https://www.veritantresearch.com/",
            "logo": "https://www.veritantresearch.com/assets/favicon/icon-512.png",
            "email": "research@veritantresearch.com"
          },
          {
            "@type": "AboutPage",
            "@id": "https://www.veritantresearch.com/team.html#webpage",
            "url": "https://www.veritantresearch.com/team.html",
            "name": "Team",
            "description": "Meet the Veritant team: researchers, analysts and event builders who spend the year talking to advisors, their firms, their peers and their competitors.",
            "isPartOf": {
              "@type": "WebSite",
              "@id": "https://www.veritantresearch.com/#website",
              "name": "Veritant Research",
              "url": "https://www.veritantresearch.com/"
            },
            "publisher": {
              "@id": "https://www.veritantresearch.com/#organization"
            },
            "breadcrumb": {
              "@id": "https://www.veritantresearch.com/team.html#breadcrumb"
            }
          },
          {
            "@type": "BreadcrumbList",
            "@id": "https://www.veritantresearch.com/team.html#breadcrumb",
            "itemListElement": [
              {
                "@type": "ListItem",
                "position": 1,
                "name": "Home",
                "item": "https://www.veritantresearch.com/"
              },
              {
                "@type": "ListItem",
                "position": 2,
                "name": "Team",
                "item": "https://www.veritantresearch.com/team.html"
              }
            ]
          }
        ]
      }
    </script>
    <script src="js/vendor/dc-runtime.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,200..800;1,200..800&display=swap">
			<link rel="stylesheet" href="css/main.css?v=126" />
      </helmet>

      <div class="site">
<sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
          <div class="toast">{{ toast }}</div>
        </sc-if>

        <sc-if value="{{ introOn }}" hint-placeholder-val="{{ false }}">
          <div
            data-vt-intro="1"
            onClick="{{ closeIntro }}"
            class="intro-modal"
            style="animation:{{ introAnim }}">
            <div
              role="dialog"
              aria-modal="true"
              aria-label="Announcement"
              onClick="{{ stopProp }}"
              class="intro-modal__dialog"
              style="animation:{{ introContentAnim }}">
              <div aria-hidden="true" class="intro-modal__rings">
                <div class="intro-modal__ring intro-modal__ring--1"></div>
                <div class="intro-modal__ring intro-modal__ring--2"></div>
                <div class="intro-modal__ring intro-modal__ring--3"></div>
                <div class="intro-modal__ring intro-modal__ring--4"></div>
              </div>
              <div class="intro-modal__body">
                <div class="intro-modal__top">
                  <img
                    src="assets/veritant-white.svg"
                    alt="Veritant"
                    class="intro-modal__logo" />
                  <button
                    onClick="{{ closeIntro }}"
                    aria-label="Close"
                    class="intro-modal__close">
                    Close
                  </button>
                </div>
                <div class="intro-modal__content">
                  <div class="intro-modal__rule"></div>
                  <h1 class="intro-modal__title">
                    SHOOK Research is now Veritant.
                  </h1>
                  <div class="intro-modal__action">
                    <button
                      onClick="{{ closeIntro }}"
                      class="intro-modal__enter link-chevron">
                      Enter site
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </sc-if>

        <main class="site-main">
          <!-- ================= TEAM ================= -->
          <section data-screen-label="Team" class="team">
            <div class="team__inner">
              <h1 class="team__title">The people behind the research.</h1>
              <p class="team__intro">
                Research analyst and event builders who spend the year talking
                to advisors, their firms, their peers, and their competitors.
              </p>
              <div class="team__filters">
                <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
                  <button
                    type="button"
                    onClick="{{ f.select }}"
                    class="team__filter"
                    style="border-bottom:1px solid {{ f.underline }}">
                    {{ f.label }}
                  </button>
                </sc-for>
              </div>
              <div data-team-cols="{{ teamCols }}" class="team__grid">
                <sc-for list="{{ people }}" as="p" hint-placeholder-count="8">
                  <div>
                    <div
                      onMouseEnter="{{ p.enter }}"
                      onMouseLeave="{{ p.leave }}"
                      onClick="{{ p.open }}"
                      class="team-member__photo"
                      style="background:{{ p.bg }};cursor:{{ p.cursor }}">
                      <img
                        src="assets/icons/assessment-white.svg"
                        alt=""
                        class="team-member__mark"
                        style="opacity:{{ p.markOpacity }}" />
                      <sc-if
                        value="{{ p.hasPhoto }}"
                        hint-placeholder-val="{{ true }}">
                        <img
                          src="{{ p.img }}"
                          loading="lazy"
                          alt=""
                          class="team-member__image"
                          style="opacity:{{ p.imgOpacity }};mix-blend-mode:{{ p.blend }}" />
                      </sc-if>
                      <sc-if
                        value="{{ p.noPhoto }}"
                        hint-placeholder-val="{{ false }}">
                        <div class="team-member__initials">
                          {{ p.initials }}
                        </div>
                      </sc-if>
                    </div>
                    <div
                      class="team-member__name"
                      style="font-weight:{{ p.weight }}">
                      {{ p.name }}
                    </div>
                    <div class="team-member__role">{{ p.title }}</div>
                    <sc-if
                      value="{{ p.hasBio }}"
                      hint-placeholder-val="{{ false }}">
                      <a
                        href="{{ p.bioHref }}"
                        onClick="{{ p.open }}"
                        class="team-member__link link-chevron"
                        >Read bio</a
                      >
                    </sc-if>
                  </div>
                </sc-for>
              </div>
            </div>
          </section>
			</main>
			<div data-vt-site-end></div>
		</div>
	</x-dc>

    <script
      type="text/x-dc"
      data-dc-script
      data-src="js/content.js?v=126 js/site-chrome.js?v=126 js/app.js?v=126"></script>
  </body>
</html>
