<!DOCTYPE html>
<html lang="en" data-page="forbes">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- SEO -->
	<title>Forbes Partnership | Veritant Research</title>
	<meta name="description" content="Forbes is Veritant’s strategic marketing partner, distributing and marketing the advisor rankings. Previously published rankings remain live on Forbes.com.">
	<link rel="canonical" href="https://www.veritantresearch.com/forbes-partnership.html">
	<meta name="robots" content="index, follow">

	<!-- Favicons -->
	<link rel="icon" href="assets/favicon/favicon-32.png?v=140" type="image/png" sizes="32x32">
	<link rel="icon" href="assets/favicon/favicon-16.png?v=140" type="image/png" sizes="16x16">
	<link rel="icon" href="assets/favicon/favicon.svg?v=140" type="image/svg+xml">
	<link rel="shortcut icon" href="favicon.ico?v=140">
	<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png?v=140">
	<link rel="manifest" href="site.webmanifest">
	<meta name="theme-color" content="#022E59">

	<!-- Open Graph (Facebook, LinkedIn, etc.) -->
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="Veritant Research">
	<meta property="og:locale" content="en_US">
	<meta property="og:title" content="Forbes Partnership | Veritant Research">
	<meta property="og:description" content="Forbes is Veritant’s strategic marketing partner, distributing and marketing the advisor rankings. Previously published rankings remain live on Forbes.com.">
	<meta property="og:url" content="https://www.veritantresearch.com/forbes-partnership.html">
	<meta property="og:image" content="https://www.veritantresearch.com/assets/social/og-default.jpg">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta property="og:image:alt" content="Veritant: independent research, trusted advisor rankings">

	<!-- Twitter / X -->
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Forbes Partnership | Veritant Research">
	<meta name="twitter:description" content="Forbes is Veritant’s strategic marketing partner, distributing and marketing the advisor rankings. Previously published rankings remain live on Forbes.com.">
	<meta name="twitter:image" content="https://www.veritantresearch.com/assets/social/og-default.jpg">
	<meta name="twitter:image:alt" content="Veritant: independent research, trusted advisor rankings">

	<!-- Structured data -->
	<script type="application/ld+json">
		{
		  "@context": "https://schema.org",
		  "@graph": [
		    {
		      "@type": "Organization",
		      "@id": "https://www.veritantresearch.com/#organization",
		      "name": "Veritant Research",
		      "alternateName": "SHOOK Research",
		      "url": "https://www.veritantresearch.com/",
		      "logo": "https://www.veritantresearch.com/assets/favicon/icon-512.png",
		      "email": "research@veritantresearch.com"
		    },
		    {
		      "@type": "WebPage",
		      "@id": "https://www.veritantresearch.com/forbes-partnership.html#webpage",
		      "url": "https://www.veritantresearch.com/forbes-partnership.html",
		      "name": "Forbes Partnership",
		      "description": "Forbes is Veritant’s strategic marketing partner, distributing and marketing the advisor rankings. Previously published rankings remain live on Forbes.com.",
		      "isPartOf": {
		        "@type": "WebSite",
		        "@id": "https://www.veritantresearch.com/#website",
		        "name": "Veritant Research",
		        "url": "https://www.veritantresearch.com/"
		      },
		      "publisher": {
		        "@id": "https://www.veritantresearch.com/#organization"
		      },
		      "breadcrumb": {
		        "@id": "https://www.veritantresearch.com/forbes-partnership.html#breadcrumb"
		      }
		    },
		    {
		      "@type": "BreadcrumbList",
		      "@id": "https://www.veritantresearch.com/forbes-partnership.html#breadcrumb",
		      "itemListElement": [
		        {
		          "@type": "ListItem",
		          "position": 1,
		          "name": "Home",
		          "item": "https://www.veritantresearch.com/"
		        },
		        {
		          "@type": "ListItem",
		          "position": 2,
		          "name": "Forbes Partnership",
		          "item": "https://www.veritantresearch.com/forbes-partnership.html"
		        }
		      ]
		    }
		  ]
		}
	</script>
	<script src="js/vendor/dc-runtime.js"></script>
</head>
<body>
	<x-dc>
		<helmet>
			<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,200..800;1,200..800&display=swap">
			<link rel="stylesheet" href="css/main.css?v=140">
		</helmet>

		<div class="site">
<sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
				<div class="toast">{{ toast }}</div>
			</sc-if>

			<sc-if value="{{ introOn }}" hint-placeholder-val="{{ false }}">
				<div data-vt-intro="1" onClick="{{ closeIntro }}" class="intro-modal" style="animation:{{ introAnim }}">
					<div role="dialog" aria-modal="true" aria-label="Announcement" onClick="{{ stopProp }}" class="intro-modal__dialog" style="animation:{{ introContentAnim }}">
						<div aria-hidden="true" class="intro-modal__rings">
							<div class="intro-modal__ring intro-modal__ring--1"></div>
							<div class="intro-modal__ring intro-modal__ring--2"></div>
							<div class="intro-modal__ring intro-modal__ring--3"></div>
							<div class="intro-modal__ring intro-modal__ring--4"></div>
						</div>
						<div class="intro-modal__body">
							<div class="intro-modal__top">
								<img src="assets/veritant-white.svg" alt="Veritant" class="intro-modal__logo">
								<button onClick="{{ closeIntro }}" aria-label="Close" class="intro-modal__close">Close</button>
							</div>
							<div class="intro-modal__content">
								<div class="intro-modal__rule"></div>
								<h1 class="intro-modal__title">SHOOK Research is now Veritant.</h1>
								<div class="intro-modal__action">
									<button onClick="{{ closeIntro }}" class="intro-modal__enter link-chevron">Enter site</button>
								</div>
							</div>
						</div>
					</div>
				</div>
			</sc-if>

			<main class="site-main">
				<!-- ================= FORBES PARTNERSHIP ================= -->
				<section data-screen-label="Forbes hero" data-vt-hero="1" style="background:linear-gradient(160deg,#0548E0 0%,#0556CC 45%,#2F86E8 100%);position:relative;overflow:hidden">
					<div data-hero-art="1" style="position:absolute;right:5%;top:50%;transform:translateY(-50%);width:clamp(220px,26vw,380px);aspect-ratio:1;background:{{ artColor }};opacity:.85;-webkit-mask-image:{{ artMask }};mask-image:{{ artMask }};-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;pointer-events:none"></div>
					<div data-rsp-pad="1" style="max-width:1280px;margin:0 auto;padding:140px 40px 180px;box-sizing:border-box;position:relative">
						<h1 style="margin:0 0 28px;color:#fff;font-weight:300;font-size:clamp(34px,4vw,52px);line-height:1.12;max-width:640px">Forbes Partnership</h1>
						<p style="margin:0;color:#fff;font-size:20px;line-height:1.5;max-width:710px;font-weight:300">Forbes is our strategic marketing partner, who distributes and markets the rankings.</p>
					</div>
				</section>
			</main>
			<div data-vt-site-end></div>
		</div>
	</x-dc>

	<script type="text/x-dc" data-dc-script data-src="js/content.js?v=140 js/site-chrome.js?v=140 js/app.js?v=140"></script>
</body>
</html>
