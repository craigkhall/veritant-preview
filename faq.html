<!DOCTYPE html>
<html lang="en" data-page="faq">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- SEO -->
	<title>FAQs | Veritant Research</title>
	<meta name="description" content="Answers to common questions about Veritant Research: what we do, the research cycle and rankings calendar, and how we keep our research independent.">
	<link rel="canonical" href="https://www.veritantresearch.com/faq.html">
	<meta name="robots" content="index, follow">

	<!-- Favicons -->
	<link rel="icon" href="favicon.ico" sizes="32x32">
	<link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
	<link rel="manifest" href="site.webmanifest">
	<meta name="theme-color" content="#022E59">

	<!-- Open Graph (Facebook, LinkedIn, etc.) -->
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="Veritant Research">
	<meta property="og:locale" content="en_US">
	<meta property="og:title" content="FAQs | Veritant Research">
	<meta property="og:description" content="Answers to common questions about Veritant Research: what we do, the research cycle and rankings calendar, and how we keep our research independent.">
	<meta property="og:url" content="https://www.veritantresearch.com/faq.html">
	<meta property="og:image" content="https://www.veritantresearch.com/assets/social/og-default.jpg">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta property="og:image:alt" content="Veritant: independent research, trusted advisor rankings">

	<!-- Twitter / X -->
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="FAQs | Veritant Research">
	<meta name="twitter:description" content="Answers to common questions about Veritant Research: what we do, the research cycle and rankings calendar, and how we keep our research independent.">
	<meta name="twitter:image" content="https://www.veritantresearch.com/assets/social/og-default.jpg">
	<meta name="twitter:image:alt" content="Veritant: independent research, trusted advisor rankings">

	<!-- Structured data -->
	<script type="application/ld+json">
		{
		  "@context": "https://schema.org",
		  "@graph": [
		    {
		      "@type": "Organization",
		      "@id": "https://www.veritantresearch.com/#organization",
		      "name": "Veritant Research",
		      "alternateName": "SHOOK Research",
		      "url": "https://www.veritantresearch.com/",
		      "logo": "https://www.veritantresearch.com/assets/favicon/icon-512.png",
		      "email": "research@veritantresearch.com"
		    },
		    {
		      "@type": "FAQPage",
		      "@id": "https://www.veritantresearch.com/faq.html#webpage",
		      "url": "https://www.veritantresearch.com/faq.html",
		      "name": "FAQs",
		      "description": "Answers to common questions about Veritant Research: what we do, the research cycle and rankings calendar, and how we keep our research independent.",
		      "isPartOf": {
		        "@type": "WebSite",
		        "@id": "https://www.veritantresearch.com/#website",
		        "name": "Veritant Research",
		        "url": "https://www.veritantresearch.com/"
		      },
		      "publisher": {
		        "@id": "https://www.veritantresearch.com/#organization"
		      },
		      "breadcrumb": {
		        "@id": "https://www.veritantresearch.com/faq.html#breadcrumb"
		      },
		      "mainEntity": [
		        {
		          "@type": "Question",
		          "name": "What does Veritant do?",
		          "acceptedAnswer": {
		            "@type": "Answer",
		            "text": "Veritant produces independent, research-based rankings of top financial advisors and brings the industry together through high impact and high energy events. Behind every ranking is real due diligence — over 10 years, we've reviewed more than 50,000 survey submissions and met with over 7,000 advisors in person."
		          }
		        },
		        {
		          "@type": "Question",
		          "name": "Where are the historical Rankings?",
		          "acceptedAnswer": {
		            "@type": "Answer",
		            "text": "All current rankings can be found on Forbes.com. Check back soon for historical rankings on our website."
		          }
		        },
		        {
		          "@type": "Question",
		          "name": "Research cycle and rankings calendar",
		          "acceptedAnswer": {
		            "@type": "Answer",
		            "text": "The first Veritant Research rankings will be published in December 2026, starting with the Top RIA Firms. The 2027 research cycle opens for submissions in January 2027. A full calendar of criteria, submission deadlines and publication dates will be published before submissions open."
		          }
		        },
		        {
		          "@type": "Question",
		          "name": "Can I submit my survey now?",
		          "acceptedAnswer": {
		            "@type": "Answer",
		            "text": "Not yet. Submissions open in January 2027, and there is no cost to apply or be considered. Join our email list below and we’ll let you know when the cycle opens. Submissions will be accepted via our website, starting in January 2027."
		          }
		        },
		        {
		          "@type": "Question",
		          "name": "I was previously named to a Forbes | Shook list. Can I still market my award?",
		          "acceptedAnswer": {
		            "@type": "Answer",
		            "text": "Yes, you can still market the award under the Forbes | Shook rankings, subject to your firm's guidance. You can market the award consistent with the naming convention provided at the time."
		          }
		        },
		        {
		          "@type": "Question",
		          "name": "Do I need to reapply each year to be considered for the ranking?",
		          "acceptedAnswer": {
		            "@type": "Answer",
		            "text": "Yes. Advisors are required to confirm their information annually in order to be considered. Advisors are evaluated against the published criteria for each research cycle. Any data you submitted in the 2026 calendar year will be used as part of our due diligence process for 2027 rankings. You may be asked to refresh and or confirm certain information prior to 2027 publication."
		          }
		        },
		        {
		          "@type": "Question",
		          "name": "Is there a cost to apply or be ranked?",
		          "acceptedAnswer": {
		            "@type": "Answer",
		            "text": "No. There is no cost to apply, be considered or be ranked. Advisors may choose to purchase marketing materials after recognition, but those purchases do not influence the research or ranking outcome."
		          }
		        },
		        {
		          "@type": "Question",
		          "name": "How are the rankings determined?",
		          "acceptedAnswer": {
		            "@type": "Answer",
		            "text": ""
		          }
		        }
		      ]
		    },
		    {
		      "@type": "BreadcrumbList",
		      "@id": "https://www.veritantresearch.com/faq.html#breadcrumb",
		      "itemListElement": [
		        {
		          "@type": "ListItem",
		          "position": 1,
		          "name": "Home",
		          "item": "https://www.veritantresearch.com/"
		        },
		        {
		          "@type": "ListItem",
		          "position": 2,
		          "name": "FAQs",
		          "item": "https://www.veritantresearch.com/faq.html"
		        }
		      ]
		    }
		  ]
		}
	</script>
	<script src="js/vendor/dc-runtime.js"></script>
</head>
<body>
	<x-dc>
		<helmet>
			<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,200..800;1,200..800&display=swap">
			<link rel="stylesheet" href="css/main.css?v=129">
		</helmet>

		<div class="site">
<sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
				<div class="toast">{{ toast }}</div>
			</sc-if>

			<sc-if value="{{ introOn }}" hint-placeholder-val="{{ false }}">
				<div data-vt-intro="1" onClick="{{ closeIntro }}" class="intro-modal" style="animation:{{ introAnim }}">
					<div role="dialog" aria-modal="true" aria-label="Announcement" onClick="{{ stopProp }}" class="intro-modal__dialog" style="animation:{{ introContentAnim }}">
						<div aria-hidden="true" class="intro-modal__rings">
							<div class="intro-modal__ring intro-modal__ring--1"></div>
							<div class="intro-modal__ring intro-modal__ring--2"></div>
							<div class="intro-modal__ring intro-modal__ring--3"></div>
							<div class="intro-modal__ring intro-modal__ring--4"></div>
						</div>
						<div class="intro-modal__body">
							<div class="intro-modal__top">
								<img src="assets/veritant-white.svg" alt="Veritant" class="intro-modal__logo">
								<button onClick="{{ closeIntro }}" aria-label="Close" class="intro-modal__close">Close</button>
							</div>
							<div class="intro-modal__content">
								<div class="intro-modal__rule"></div>
								<h1 class="intro-modal__title">SHOOK Research is now Veritant.</h1>
								<div class="intro-modal__action">
									<button onClick="{{ closeIntro }}" class="intro-modal__enter link-chevron">Enter site</button>
								</div>
							</div>
						</div>
					</div>
				</div>
			</sc-if>

			<main class="site-main">
				<!-- ================= FAQ ================= -->
				<section data-screen-label="FAQ hero" data-vt-hero="1" style="background:linear-gradient(160deg,#0548E0 0%,#0556CC 45%,#2F86E8 100%);position:relative;overflow:hidden">
					<div data-hero-art="1" style="position:absolute;right:-4%;top:50%;transform:translateY(-50%);height:calc(118% - 60px);width:auto;aspect-ratio:1;background:{{ artColor }};opacity:.85;-webkit-mask-image:{{ artMask }};mask-image:{{ artMask }};-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;pointer-events:none"></div>
					<div data-rsp-pad="1" style="max-width:1280px;margin:0 auto;padding:140px 40px 180px;box-sizing:border-box;position:relative">
						<h1 style="margin:0 0 28px;color:#fff;font-weight:300;font-size:clamp(34px,4vw,52px);line-height:1.12">What is coming next!</h1>
						<p style="margin:0;color:#fff;font-weight:300;font-size:clamp(20px,2vw,26px);line-height:1.3;max-width:760px">Information you need to know now!</p>
					</div>
				</section>
				<section class="faq-list">
					<div class="faq-list__inner">
						<sc-for list="{{ faqItems }}" as="q" hint-placeholder-count="12">
							<div class="faq-item">
								<button type="button" onClick="{{ q.toggle }}" aria-expanded="{{ q.open }}" class="faq-item__toggle">
									<span class="faq-item__question" style="color:{{ q.color }}">{{ q.q }}</span>
									<span class="faq-item__sign">{{ q.sign }}</span>
								</button>
								<sc-if value="{{ q.open }}" hint-placeholder-val="{{ false }}">
									<div class="faq-item__answer">
										<sc-for list="{{ q.a }}" as="para" hint-placeholder-count="1">
											<p class="faq-item__text">{{ para }}</p>
										</sc-for>
										<sc-if value="{{ q.hasLink }}" hint-placeholder-val="{{ false }}">
											<a href="{{ q.linkHref }}" target="{{ q.linkTarget }}" rel="noopener" onClick="{{ q.onLink }}" class="faq-item__link link-chevron">{{ q.linkLabel }}</a>
										</sc-if>
									</div>
								</sc-if>
							</div>
						</sc-for>
					</div>
				</section>
			</main>
			<div data-vt-site-end></div>
		</div>
	</x-dc>

	<script type="text/x-dc" data-dc-script data-src="js/content.js?v=129 js/site-chrome.js?v=129 js/app.js?v=129"></script>
</body>
</html>
