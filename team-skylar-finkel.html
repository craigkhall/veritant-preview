<body>
	<x-dc>
		<helmet>
			<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,200..800;1,200..800&display=swap">
			<link rel="stylesheet" href="css/main.css?v=134">
		</helmet>

		<div class="site">
<sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
				<div class="toast">{{ toast }}</div>
			</sc-if>

			<sc-if value="{{ introOn }}" hint-placeholder-val="{{ false }}">
				<div data-vt-intro="1" onClick="{{ closeIntro }}" class="intro-modal" style="animation:{{ introAnim }}">
					<div role="dialog" aria-modal="true" aria-label="Announcement" onClick="{{ stopProp }}" class="intro-modal__dialog" style="animation:{{ introContentAnim }}">
						<div aria-hidden="true" class="intro-modal__rings">
							<div class="intro-modal__ring intro-modal__ring--1"></div>
							<div class="intro-modal__ring intro-modal__ring--2"></div>
							<div class="intro-modal__ring intro-modal__ring--3"></div>
							<div class="intro-modal__ring intro-modal__ring--4"></div>
						</div>
						<div class="intro-modal__body">
							<div class="intro-modal__top">
								<img src="assets/veritant-white.svg" alt="Veritant" class="intro-modal__logo">
								<button onClick="{{ closeIntro }}" aria-label="Close" class="intro-modal__close">Close</button>
							</div>
							<div class="intro-modal__content">
								<div class="intro-modal__rule"></div>
								<h1 class="intro-modal__title">SHOOK Research is now Veritant.</h1>
								<div class="intro-modal__action">
									<button onClick="{{ closeIntro }}" class="intro-modal__enter link-chevron">Enter site</button>
								</div>
							</div>
						</div>
					</div>
				</div>
			</sc-if>

			<main class="site-main">
				<!-- ================= TEAM BIO ================= -->
				<section data-screen-label="Team bio" class="team-bio">
					<div class="team-bio__inner">
						<a href="team.html" class="team-bio__back">Team</a>
						<div class="team-bio__grid">
							<div class="team-bio__photo">
								<sc-if value="{{ bio.hasPhoto }}" hint-placeholder-val="{{ true }}">
									<img src="{{ bio.img }}" loading="lazy" alt="{{ bio.name }}" class="team-bio__image">
								</sc-if>
								<sc-if value="{{ bio.noPhoto }}" hint-placeholder-val="{{ false }}">
									<div class="team-bio__initials">{{ bio.initials }}</div>
								</sc-if>
							</div>
							<div>
								<h1 class="team-bio__name">{{ bio.name }}</h1>
								<div class="team-bio__role">{{ bio.title }}</div>
								<div class="team-bio__body">
									<sc-for list="{{ bio.paras }}" as="para" hint-placeholder-count="3">
										<p class="team-bio__text">{{ para }}</p>
									</sc-for>
								</div>
								<div class="team-bio__actions">
									<button type="button" onClick="{{ openContact }}" class="team-bio__contact">Contact {{ bio.first }}</button>
									<sc-if value="{{ bio.hasLinkedin }}" hint-placeholder-val="{{ false }}">
										<a href="{{ bio.linkedin }}" target="_blank" rel="noopener" class="team-bio__linkedin">LinkedIn</a>
									</sc-if>
								</div>
							</div>
						</div>
					</div>
				</section>
				<sc-if value="{{ contactOpen }}" hint-placeholder-val="{{ false }}">
					<div onClick="{{ closeContact }}" class="contact-modal">
						<div role="dialog" aria-modal="true" aria-label="{{ contactLabel }}" onClick="{{ stopProp }}" class="contact-modal__dialog">
							<div class="contact-modal__header">
								<div class="contact-modal__recipient">To: {{ bio.name }}</div>
								<button type="button" onClick="{{ closeContact }}" class="contact-modal__close">Close</button>
							</div>
							<sc-if value="{{ contactForm }}" hint-placeholder-val="{{ true }}">
								<h2 class="contact-modal__title contact-modal__title--form">Send {{ bio.first }} a note.</h2>
								<form onSubmit="{{ submitContact }}" class="contact-modal__form">
									<input type="hidden" name="recipient" value="{{ bio.name }}">
									<input required="{{ true }}" name="name" placeholder="Name" aria-label="Name" class="contact-modal__field">
									<input required="{{ true }}" type="email" name="email" placeholder="Email address" aria-label="Email address" class="contact-modal__field contact-modal__field--email">
									<input name="firm" placeholder="Firm" aria-label="Firm" class="contact-modal__field">
									<textarea required="{{ true }}" name="message" rows="5" placeholder="Message" aria-label="Message" class="contact-modal__field contact-modal__field--message"></textarea>
									<button type="submit" class="contact-modal__submit">Send note</button>
								</form>
							</sc-if>
							<sc-if value="{{ contactSent }}" hint-placeholder-val="{{ false }}">
								<h2 class="contact-modal__title contact-modal__title--success">Thank you.</h2>
								<p class="contact-modal__text">Your note has been sent to {{ bio.first }}.</p>
							</sc-if>
						</div>
					</div>
				</sc-if>
			</main>
			<div data-vt-site-end></div>
		</div>
	</x-dc>

	<script type="text/x-dc" data-dc-script data-src="js/content.js?v=134 js/site-chrome.js?v=134 js/app.js?v=134"></script>
